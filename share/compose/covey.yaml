# Covey services. Credentials are chosen so a stock Laravel .env works
# unchanged: 127.0.0.1, root, empty password, default ports (Postgres excepted:
# it is on 5433 so it can run beside a Supabase stack on 5432).
# Everything binds to loopback only.
name: covey

services:
  mysql:
    image: mariadb:11
    restart: unless-stopped
    ports: ["127.0.0.1:3306:3306"]
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_ROOT_HOST: "%"
    volumes: ["covey-mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # 5433, not 5432: the prism Supabase stack (config.toml [db] port) owns 5432 on this machine.
    ports: ["127.0.0.1:5433:5432"]
    environment:
      # trust auth so Laravel's stock pgsql defaults (root / empty password) work,
      # exactly as the mysql service does. Loopback-only.
      POSTGRES_USER: root
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: ["covey-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["covey-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: "5000"
    volumes: ["covey-mailpit:/data"]

  # Optional: part of the stack only after `covey services enable s3`, which
  # adds the profile to ~/.config/covey/services.env (COMPOSE_PROFILES).
  # S3 API on :9000; :9001 serves the same API plus the console, which is
  # what s3.localhost proxies to.
  s3:
    image: rustfs/rustfs:latest
    profiles: [s3]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # S3 API + console
    environment:
      RUSTFS_ACCESS_KEY: covey
      RUSTFS_SECRET_KEY: coveysecret
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: ["covey-s3:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  covey-mysql:
  covey-postgres:
  covey-redis:
  covey-mailpit:
  covey-s3:
